name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi
          
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect Java major version!"
            exit 1
          fi
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17!"
            exit 1
          fi
          
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Keeping existing file."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Built APK ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty (0 bytes)!"
            exit 1
          fi
          
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension!"; exit 1 ;;
          esac
          
          echo "APK successfully verified at: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          TARGET_ASSET="$TEMP_RELEASE_DIR/app-debug.apk"
          cp "$SOURCE_APK" "$TARGET_ASSET"
          
          if [ ! -f "$TARGET_ASSET" ] || [ ! -s "$TARGET_ASSET" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_ASSET"
            exit 1
          fi
          
          echo "asset_path=$TARGET_ASSET" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_ASSET"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty!"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not end in .apk!"; exit 1 ;;
          esac
          
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset name must be exactly app-debug.apk, found: $ASSET_NAME"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES="### ANGOFLY Debug APK
          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Note:** This APK is intended for testing and development. It is signed with a temporary debug keystore and is not a Play Store production release."
          
          echo "Creating release $TAG_NAME targeting ${{ github.sha }}..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          
          BUILD_OUTCOME="${{ steps.publish_release.outcome }}"
          
          if [ "$BUILD_OUTCOME" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            
            echo "Release published successfully!"
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "Download the latest debug APK directly here:"
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "> **Backup:** The normal Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publication did not succeed or was skipped."
            echo "Status: $BUILD_OUTCOME"
            echo "However, if the APK build succeeded, the GitHub Actions artifact 'app-debug-apk' remains available for download from this workflow run."
            
            {
              echo "## APK Build Status"
              echo ""
              echo "> **Notice:** GitHub Release publication encountered an issue, but the backup artifact \`app-debug-apk\` is available under this workflow run artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
